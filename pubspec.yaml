name: newproject
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  # Cupertino Icons
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.9.0

  # Country phone field
  country_phone_field: ^0.1.1

  # HTTP requests
  http: ^1.6.0

  # OpenStreetMap
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

  # Current device location
  geolocator: ^14.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Flutter lints
  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/images/